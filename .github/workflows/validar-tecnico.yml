name: Validar carreira como técnico
on:
  push:
    branches: [feature/carreira-tecnico-pos-aposentadoria]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - run: npm run build
