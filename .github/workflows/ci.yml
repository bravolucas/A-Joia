name: Validar A JOIA
# Roda em todo push na main e em todo pull request:
# 1) testes de lógica, dividindo carreiras longas em jobs paralelos, e build;
# 2) testes no navegador (Playwright) em desktop e celular, contra o build do GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Regressões rápidas de mercado e veteranos IA
        run: node --test tests/mercado-ia.test.mjs tests/fase4-disponibilidade-veteranos.test.mjs tests/fase4-mercado-veteranos.test.mjs
      - name: Testes de lógica (exceto carreiras massivas)
        shell: bash
        run: |
          # Todos os arquivos continuam obrigatórios: os quatro retirados deste
          # grupo são executados pela matriz carreiras-massivas, sem reduções.
          arquivos=()
          for caminho in tests/*.test.mjs; do
            case "$caminho" in
              tests/integracao-jogador-tecnico.test.mjs|tests/jogador-melhorias.test.mjs|tests/treinador-expresso.test.mjs|tests/simulacao-massiva-tecnico.test.mjs) ;;
              *) arquivos+=("$caminho") ;;
            esac
          done
          test "${#arquivos[@]}" -gt 0
          node --test "${arquivos[@]}"
      - name: Gerar versão de produção
        run: npm run build

  carreiras-massivas:
    runs-on: ubuntu-latest
    # São os mesmos arquivos e cenários da suíte original, em runners isolados.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arquivo:
          - tests/integracao-jogador-tecnico.test.mjs
          - tests/jogador-melhorias.test.mjs
          - tests/treinador-expresso.test.mjs
          - tests/simulacao-massiva-tecnico.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar cenário de carreira completo
        run: node --test "${{ matrix.arquivo }}"

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save @playwright/test wait-on
      - run: npx playwright install --with-deps chromium
      - run: GITHUB_PAGES=true npm run build
      - name: Testes no navegador (todos os tests/*.spec.mjs)
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 &
          npx wait-on http://127.0.0.1:4173/A-Joia/
          npx playwright test tests/*.spec.mjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-navegador
          path: test-results/
          retention-days: 7
