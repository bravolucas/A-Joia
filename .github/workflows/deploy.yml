name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Liberar publicação interrompida do desafio
        if: github.event.before == '8aa76590ba51e0b1d3aef6c88d57c7bad0eb156f'
        uses: actions/github-script@v7
        with:
          script: |
            // Recuperação limitada ao deployment que expirou no run 41893625961.
            const deploymentId = '1dffd03bc6c52e92463c19b83858b553a48dc136';
            const params = { ...context.repo, deploymentId };
            const route = 'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}';
            const finished = new Set(['succeed', 'success', 'finished', 'cancelled', 'canceled', 'deployment_cancelled']);
            const read = async () => {
              try { return (await github.request(route, params)).data.status; }
              catch (error) { if (error.status === 404) return 'missing'; throw error; }
            };
            let status = await read();
            core.notice(`Estado do deployment bloqueador: ${status}`);
            if (!['succeed', 'success', 'finished', 'missing'].includes(status)) {
              // Reenvia o cancelamento do bloqueador conhecido, mesmo se marcado cancelado.
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', params);
              } catch (error) {
                if (!finished.has(status)) throw error;
                core.warning(`O Pages já considera o deployment encerrado (HTTP ${error.status}).`);
              }
              for (let i = 0; i < 12; i++) {
                status = await read();
                if (finished.has(status) || status === 'missing') break;
                await new Promise(resolve => setTimeout(resolve, 2000));
              }
              core.notice(`Estado após cancelamento: ${status}`);
              if (!finished.has(status) && status !== 'missing') throw new Error('O Pages ainda não liberou o deployment interrompido.');
            }
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: deploy_retry
        name: Repetir publicação após falha
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
