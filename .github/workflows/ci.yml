name: Validar A JOIA
# Roda em todo push na main e em todo pull request:
# 1) testes de lógica, dividindo carreiras longas em jobs paralelos, e build;
# 2) testes no navegador (Playwright) em desktop e celular, contra o build do GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Regressões rápidas de mercado e veteranos IA
        run: node --test tests/mercado-ia.test.mjs tests/fase4-disponibilidade-veteranos.test.mjs tests/fase4-mercado-veteranos.test.mjs
      - name: Testes de lógica (exceto carreiras massivas)
        shell: bash
        run: |
          # Todos os arquivos continuam obrigatórios: os quatro retirados deste
          # grupo são executados pela matriz carreiras-massivas, sem reduções.
          arquivos=()
          for caminho in tests/*.test.mjs; do
            case "$caminho" in
              tests/integracao-jogador-tecnico.test.mjs|tests/jogador-melhorias.test.mjs|tests/treinador-expresso.test.mjs|tests/simulacao-massiva-tecnico.test.mjs) ;;
              *) arquivos+=("$caminho") ;;
            esac
          done
          test "${#arquivos[@]}" -gt 0
          # A suíte extensa pode produzir logs superiores ao limite de leitura do GitHub.
          # Capturar a saída preserva o código de falha e permite identificar erros reais.
          saida="$RUNNER_TEMP/a-joia-testes-logica.log"
          set +e
          node --test "${arquivos[@]}" > "$saida" 2>&1
          codigo=$?
          set -e
          if [ "$codigo" -ne 0 ]; then
            echo "::error::Testes de lógica falharam (exit $codigo). Ocorrências relevantes:"
            grep -n -E 'not ok|^# (fail|tests|pass|cancelled|skipped)|ERR_|Error:|error:' "$saida" | tail -n 90 || true
          fi
          echo "Resumo final da execução:"
          tail -n 110 "$saida"
          exit "$codigo"
      - name: Gerar versão de produção
        run: npm run build

  carreiras-massivas:
    name: carreiras-massivas (${{ matrix.caso }})
    runs-on: ubuntu-latest
    # Nove runners: integração 32 casos em 4x8; melhorias 24 casos em 4x6;
    # treinador e simulação massiva permanecem completos num runner.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - caso: integracao-1-de-4
            arquivos: tests/integracao-jogador-tecnico.test.mjs
            parte: 1
            partes: 4
          - caso: integracao-2-de-4
            arquivos: tests/integracao-jogador-tecnico.test.mjs
            parte: 2
            partes: 4
          - caso: integracao-3-de-4
            arquivos: tests/integracao-jogador-tecnico.test.mjs
            parte: 3
            partes: 4
          - caso: integracao-4-de-4
            arquivos: tests/integracao-jogador-tecnico.test.mjs
            parte: 4
            partes: 4
          - caso: jogador-melhorias-1-de-4
            arquivos: tests/jogador-melhorias.test.mjs
            parte: 1
            partes: 1
            melhorias_parte: 1
            melhorias_partes: 4
          - caso: jogador-melhorias-2-de-4
            arquivos: tests/jogador-melhorias.test.mjs
            parte: 1
            partes: 1
            melhorias_parte: 2
            melhorias_partes: 4
          - caso: jogador-melhorias-3-de-4
            arquivos: tests/jogador-melhorias.test.mjs
            parte: 1
            partes: 1
            melhorias_parte: 3
            melhorias_partes: 4
          - caso: jogador-melhorias-4-de-4
            arquivos: tests/jogador-melhorias.test.mjs
            parte: 1
            partes: 1
            melhorias_parte: 4
            melhorias_partes: 4
          - caso: treinador-e-simulacao
            arquivos: tests/treinador-expresso.test.mjs tests/simulacao-massiva-tecnico.test.mjs
            parte: 1
            partes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Executar todos os cenários atribuídos ao runner
        shell: bash
        env:
          A_JOIA_INTEGRACAO_PARTE: ${{ matrix.parte }}
          A_JOIA_INTEGRACAO_PARTES: ${{ matrix.partes }}
          A_JOIA_MELHORIAS_PARTE: ${{ matrix.melhorias_parte }}
          A_JOIA_MELHORIAS_PARTES: ${{ matrix.melhorias_partes }}
          ARQUIVOS_CARREIRAS: ${{ matrix.arquivos }}
        run: |
          read -r -a arquivos <<< "$ARQUIVOS_CARREIRAS"
          test "${#arquivos[@]}" -gt 0
          node --test "${arquivos[@]}"
      - name: Publicar relatório das oito carreiras de integração
        if: ${{ startsWith(matrix.caso, 'integracao-') }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.caso }}
          path: resultados-auditoria/integracao-parte-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Publicar relatórios das seis carreiras da partição
        if: ${{ startsWith(matrix.caso, 'jogador-melhorias-') }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.caso }}
          path: resultados-auditoria/jogador-melhorias-parte-*.json
          if-no-files-found: error
          retention-days: 14

  conferir-integracao-32:
    name: conferir-integracao-32
    needs: carreiras-massivas
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: resultados-integracao-*
          merge-multiple: true
          path: resultados-auditoria
      - name: Exigir 32 carreiras únicas e os limiares globais originais
        run: node scripts/agregar-integracao-32.mjs resultados-auditoria
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: integracao-jogador-treinador-32-validada
          path: resultados-auditoria/integracao-32-validada.json
          retention-days: 14

  conferir-melhorias-24:
    name: conferir-melhorias-24
    needs: carreiras-massivas
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: resultados-jogador-melhorias-*
          merge-multiple: true
          path: resultados-auditoria
      - name: Exigir os 24 cenários e os limiares globais originais
        run: node scripts/agregar-jogador-melhorias.mjs resultados-auditoria
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jogador-melhorias-24-validado
          path: resultados-auditoria/jogador-melhorias-24-agregado.json
          retention-days: 14

  navegador:
    # Os shards Playwright são complementares: ambos são obrigatórios no CI.
    # O --shard n/2 distribui todos os testes descobertos, sem pular spec.
    name: navegador (${{ matrix.parte }}-de-2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save @playwright/test wait-on
      - run: npx playwright install --with-deps chromium
      - run: GITHUB_PAGES=true npm run build
      - name: Testes no navegador (parte ${{ matrix.parte }}/2, todos os tests/*.spec.mjs)
        env:
          PARTE: ${{ matrix.parte }}
        shell: bash
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 &
          npx wait-on http://127.0.0.1:4173/A-Joia/
          # Verificação precoce dos dois cenários sensíveis: só no primeiro runner.
          # Eles continuam incluídos na suíte completa e em um dos dois shards.
          if [ "$PARTE" = "1" ]; then
            npx playwright test tests/completo-copas-persistentes.spec.mjs --reporter=line
          fi
          # Playwright particiona a suíte completa, sem duplicações entre shards.
          npx playwright test tests/*.spec.mjs --shard="${PARTE}/2" --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-navegador-${{ matrix.parte }}-de-2
          path: test-results/
          retention-days: 7
