name: Auditar campeões reais das ligas
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/dados/ligasHistoricas.js'
      - 'src/dados/estaduaisHistoricos.js'
      - 'tests/estaduais-historicos.test.mjs'
      - 'src/dados/data.js'
      - 'src/historia/competicoesHistoricas.js'
      - 'src/historia/historiaFutebol.js'
      - 'tests/ligas-historicas.test.mjs'
      - 'tests/historia-futebol.test.mjs'
  push:
    branches: [main]
    paths:
      - 'src/dados/ligasHistoricas.js'
      - 'src/historia/competicoesHistoricas.js'
      - 'src/historia/historiaFutebol.js'
  workflow_dispatch:
jobs:
  conferir-ligas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validar ligas e compatibilidade de históricos
        run: node --test tests/ligas-historicas.test.mjs tests/estaduais-historicos.test.mjs tests/competicoes-historicas.test.mjs tests/historia-futebol.test.mjs tests/galeria-titulos-conquistados.test.mjs
      - name: Validar build
        run: npm run build
