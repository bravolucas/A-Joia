name: Validacao do modo treinador
on:
  push:
    branches:
      - feature/treinador-fidelidade-balanceamento-tacas
  pull_request:
    paths:
      - 'tecnico.js'
      - 'CarreiraTecnico.jsx'
      - 'trofeus.jsx'
      - 'tacas.js'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/validacao-treinador.yml'
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
