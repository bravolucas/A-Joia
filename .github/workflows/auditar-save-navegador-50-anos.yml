name: Auditar save de 50 anos no navegador
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/armazenamento-mundo-50-anos.spec.mjs'
      - '.github/workflows/auditar-save-navegador-50-anos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexeddb-50-anos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save @playwright/test wait-on
      - run: npx playwright install --with-deps chromium
      - run: GITHUB_PAGES=true npm run build
      - name: Testar gravação, recarga e erro de cota reais no Chromium
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 &
          npx wait-on http://127.0.0.1:4173/A-Joia/
          npx playwright test tests/armazenamento-mundo-50-anos.spec.mjs --workers=1 --reporter=line
      - name: Preservar medidas e falhas do navegador
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-mundo-50-anos-indexeddb
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
