name: Auditar campeões históricos da Sul-Americana
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/dados/sulamericanaHistorica.js'
      - 'src/historia/competicoesHistoricas.js'
      - 'src/historia/historiaFutebol.js'
      - 'src/historia/HistoriaFutebol.jsx'
      - 'tests/sulamericana-historica.test.mjs'
      - '.github/workflows/auditar-sulamericana-historica.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campeoes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Histórico real, ranking, saves e regressões anteriores
        run: node --test tests/sulamericana-historica.test.mjs tests/libertadores-historica.test.mjs tests/competicoes-historicas.test.mjs tests/historia-futebol.test.mjs
      - name: Gerar build de produção para GitHub Pages
        run: GITHUB_PAGES=true npm run build
