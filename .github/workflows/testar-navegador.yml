name: Teste visual de navegador
on:
  push:
    branches: [test/browser-smoke-responsive]
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: GITHUB_PAGES=true npm run build
      - name: Iniciar servidor e executar testes desktop/mobile
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 &
          npx wait-on http://127.0.0.1:4173/A-Joia/
          npx playwright test tests/browser-smoke.spec.mjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-chromium
          path: test-results/
          retention-days: 7
