name: Validar rivalidade do Modo Rápido
on:
  push:
    branches: [feature/historico-rivalidade-rapido]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/mercado-rapido.test.mjs tests/noticias-rapido.test.mjs tests/rivalidade-rapido.test.mjs
      - run: npm run build
