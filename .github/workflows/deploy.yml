name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Liberar publicação interrompida do desafio
        uses: actions/github-script@v7
        with:
          script: |
            // Recuperação limitada ao deployment que expirou no run 41893625961.
            const deploymentId = '1dffd03bc6c52e92463c19b83858b553a48dc136';
            const params = { ...context.repo, deploymentId };
            const route = 'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}';
            const active = new Set(['queued', 'waiting', 'building', 'built', 'started', 'updating_pages', 'deployment_in_progress', 'syncing_files']);
            const read = async () => {
              try { return (await github.request(route, params)).data.status; }
              catch (error) { if (error.status === 404) return 'missing'; throw error; }
            };
            let status = await read();
            core.info(`Deployment interrompido: ${status}`);
            if (active.has(status)) {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', params);
              for (let i = 0; i < 12; i++) {
                status = await read();
                if (!active.has(status)) break;
                await new Promise(resolve => setTimeout(resolve, 2000));
              }
              if (active.has(status)) throw new Error('O Pages ainda não liberou o deployment interrompido.');
            }
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: deploy_retry
        name: Repetir publicação após falha
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
