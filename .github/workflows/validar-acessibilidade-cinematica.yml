name: Validar acessibilidade cinemática
on:
  push:
    branches: [fix/acessibilidade-cinematica]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - run: npm run build
