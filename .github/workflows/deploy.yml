name: Publicar no GitHub Pages

# Publica somente uma revisão aprovada do commit mais recente da main.
# Para forçar um novo deploy, execute manualmente "Validar A JOIA" na main.
# O workflow de publicação não aceita mais despacho direto sem testes de navegador.
on:
  workflow_run:
    workflows: ["Validar A JOIA"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  conferir-aprovacao:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      atual: ${{ steps.sha.outputs.atual }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Evitar deploy de CI de um commit antigo
        id: sha
        env:
          SHA_APROVADO: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          git fetch origin main --depth=1
          SHA_ATUAL="$(git rev-parse FETCH_HEAD)"
          if [ "$SHA_ATUAL" = "$SHA_APROVADO" ]; then
            echo "atual=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CI aprovado para $SHA_APROVADO, mas main já está em $SHA_ATUAL. Nenhuma publicação será feita."
            echo "atual=false" >> "$GITHUB_OUTPUT"
          fi

  construir:
    needs: conferir-aprovacao
    if: ${{ needs.conferir-aprovacao.outputs.atual == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O artefato precisa corresponder à revisão aprovada pelo CI.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    timeout-minutes: 35
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      # Um novo commit pode ter entrado na main durante o build.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir novamente o SHA imediatamente antes do deploy
        id: sha
        env:
          SHA_APROVADO: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          git fetch origin main --depth=1
          SHA_ATUAL="$(git rev-parse FETCH_HEAD)"
          if [ "$SHA_ATUAL" = "$SHA_APROVADO" ]; then
            echo "atual=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Publicação ignorada: main avançou para $SHA_ATUAL desde o CI $SHA_APROVADO."
            echo "atual=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deploy
        if: ${{ steps.sha.outputs.atual == 'true' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: '600000'
      - id: deploy_retry
        name: Repetir publicação após falha
        if: ${{ steps.sha.outputs.atual == 'true' && steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: '600000'
