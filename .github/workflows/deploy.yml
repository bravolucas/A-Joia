name: Publicar no GitHub Pages

# A publicação só é disparada quando a validação da main termina com
# todos os testes (lógica, navegador) e o build aprovados.
on:
  workflow_run:
    workflows: ["Validar A JOIA"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    # Ignora execuções de PR e validações que não terminaram com sucesso.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Faz o deploy do SHA que passou no CI, sem pegar um HEAD mais recente.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Uma execução manual não herda uma aprovação anterior. Mantém a
      # garantia original: falha de teste impede o deploy.
      - name: Testar antes de publicação manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm test
      # Os testes já rodaram em 'Validar A JOIA'; evita executar a suíte
      # de carreiras longas outra vez antes de disponibilizar o site.
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    timeout-minutes: 35
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: '600000'
      - id: deploy_retry
        name: Repetir publicação após falha
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: '600000'
