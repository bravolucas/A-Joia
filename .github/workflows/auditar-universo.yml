name: Auditar universo do Prompt Mestre
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/auditar-universo-prompt-mestre.mjs
      - .github/workflows/auditar-universo.yml
      - src/simulacao/profundidadeElenco.js
      - src/simulacao/nomesRegionais.js
      - src/comum/lib.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria-fundacao:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências sem alterar lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Medir 50 anos e 10 mil nomes (sem mexer nos saves)
        run: |
          mkdir -p resultados-auditoria
          node scripts/auditar-universo-prompt-mestre.mjs --anos=50 --amostra=10000 --semente=2026 --json > resultados-auditoria/universo-50anos-10mil-nomes.json
          node -e "const r=require('./resultados-auditoria/universo-50anos-10mil-nomes.json'); console.log(JSON.stringify({anos:r.parametros.anos,clubes:r.parametros.clubes,violacoes:r.mundo.violacoes,nomes:r.nomes.totalGerados,repeticaoPercentual:r.nomes.taxaRepeticaoPercentual,saveInicialBytes:r.mundo.tamanhoJsonInicialBytes,saveFinalBytes:r.mundo.tamanhoJsonFinalBytes,duracaoMs:r.medicao.duracaoMs},null,2))"
      - name: Arquivar métricas para comparação entre revisões
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-universo-50anos-10mil-nomes
          path: resultados-auditoria/*.json
          retention-days: 14
