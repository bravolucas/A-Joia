name: Validar treinador rápido
on:
  push:
    branches: [feat/treinador-fluxo-rapido]
  pull_request:
    paths: ['tecnicoRapido.js', 'CarreiraTecnico.jsx', 'tests/treinador-rapido.spec.mjs']
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - run: GITHUB_PAGES=true npm run build
      - run: npm install --no-save @playwright/test wait-on
      - run: npx playwright install --with-deps chromium
      - run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 &
          npx wait-on http://127.0.0.1:4173/A-Joia/
          npx playwright test tests/treinador-rapido.spec.mjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treinador-rapido-capturas
          path: test-results/
