name: Auditar Copa do Mundo do jogador
on:
  pull_request:
    paths:
      - 'src/jogador/copaSelecaoCompartilhada.js'
      - 'src/jogador/rapido.js'
      - 'src/jogador/ModoRapido.jsx'
      - 'src/treinador/copasEscolha.js'
      - 'tests/copa-mundo-jogador-compartilhada.test.mjs'
      - 'tests/copa-mundo-jogador-compartilhada.spec.mjs'
      - '.github/workflows/auditar-copa-mundo-jogador.yml'
  workflow_dispatch:
jobs:
  copa-jogador:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar 48 seleções, convocação, estratégias, saves e simulação automática
        run: node --test tests/copa-mundo-jogador-compartilhada.test.mjs
      - name: Compilar jogo
        run: npm run build
  copa-navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save @playwright/test wait-on
      - run: npx playwright install --with-deps chromium
      - run: GITHUB_PAGES=true npm run build
      - name: Testar sorteio, estratégias, persistência e retorno da Copa no navegador
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 &
          npx wait-on http://127.0.0.1:4173/A-Joia/
          npx playwright test tests/copa-mundo-jogador-compartilhada.spec.mjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-copa-mundo-jogador
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
