name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: read
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Diagnosticar registros da publicação expirada
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '1dffd03bc6c52e92463c19b83858b553a48dc136';
            const repo = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({ ...repo, sha, per_page: 100 });
            for (const deployment of deployments) {
              if (deployment.sha !== sha || deployment.environment !== 'github-pages') continue;
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ ...repo, deployment_id: deployment.id, per_page: 1 });
              core.notice(`Registro da tentativa expirada: ${deployment.id}, estado ${statuses[0]?.state || 'sem status'}`);
            }
            const { data: page } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', { ...repo, deploymentId: sha });
            core.notice(`Estado informado pelo Pages: ${page.status}`);
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: deploy_retry
        name: Repetir publicação após falha
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
