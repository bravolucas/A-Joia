name: Validacao do modo treinador
on:
  push:
    branches:
      - feature/treinador-fidelidade-balanceamento-tacas
      - main
  pull_request:
    paths:
      - 'tecnico.js'
      - 'elencoSelecao.js'
      - 'torneioContinental.js'
      - 'gruposCopa.js'
      - 'recordesUniverso.js'
      - 'leituraGoleiro.js'
      - 'FechamentoTemporada.*'
      - 'components.jsx'
      - 'AJoiaGame.jsx'
      - 'TabelaCompeticoesTemporada.jsx'
      - 'save.js'
      - 'index.css'
      - 'jornadaJogador.js'
      - 'narrativasContinuas.js'
      - 'JornadaUI*'
      - 'recordesHistoricos.js'
      - 'dados/**'
      - 'museu.js'
      - 'CarreiraTecnico.jsx'
      - 'trofeus.jsx'
      - 'tacas.js'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/validacao-treinador.yml'
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # O repositorio ainda nao possui package-lock.json.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npm run build
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save @playwright/test wait-on
      - run: npx playwright install chromium
      - run: GITHUB_PAGES=true npm run build
      - name: Verificar treinador, campeonatos e pop-ups em desktop e celular
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 &
          npx wait-on http://127.0.0.1:4173/A-Joia/
          npx playwright test tests/completo-resumos.spec.mjs tests/completo-mercado.spec.mjs tests/copa-grupos.spec.mjs tests/completo-campanha.spec.mjs tests/completo-janelas.spec.mjs tests/telas-legadas.spec.mjs tests/fechamento-temporada.spec.mjs tests/ovr-desktop.spec.mjs tests/jornada-proxima-etapa.spec.mjs tests/jornada-carreira.spec.mjs tests/arena-minigames.spec.mjs tests/browser-smoke.spec.mjs tests/treinos-variedade.spec.mjs tests/imersao-rapida.spec.mjs tests/criacao-carreira.spec.mjs tests/emprestimos-jogador.spec.mjs tests/coach-responsive.spec.mjs tests/coach-remodelacao.spec.mjs tests/museu.spec.mjs tests/visual-minigames.spec.mjs tests/goleiro-mergulho.spec.mjs tests/desafios-historicos.spec.mjs tests/desafio-temporada.spec.mjs tests/coach-economia.spec.mjs tests/loja-jogador.spec.mjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-navegador-treinador
          path: test-results/
          retention-days: 7
