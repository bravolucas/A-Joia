name: Auditar universo do Prompt Mestre
# Diagnóstico sem alteração do motor ou saves reais.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/auditar-universo-prompt-mestre.mjs'
      - 'scripts/auditar-catalogo-mundial-50-anos.mjs'
      - '.github/workflows/auditar-universo-prompt-mestre.yml'
      - 'tests/longevidade-elencos.test.mjs'
      - 'tests/nomes-regionais.test.mjs'
      - 'tests/profundidade-elenco.test.mjs'
  workflow_dispatch:

concurrency:
  group: auditoria-universo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditar-mundo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Regressões existentes de elencos e nomes
        run: node --test tests/longevidade-elencos.test.mjs tests/profundidade-elenco.test.mjs tests/nomes-regionais.test.mjs
      - name: Preparar diretório de resultados
        run: mkdir -p resultados-auditoria
      - name: Smoke de 3 temporadas, 830 nomes
        run: |
          node scripts/auditar-universo-prompt-mestre.mjs --anos=3 --amostra=830 --semente=2026 --json > resultados-auditoria/universo-smoke.json
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync(process.argv[1])); if(a.parametros.nacionalidades!==83||a.mundo.temporadasSimuladas!==3||a.mundo.violacoes!==0) process.exit(1);' resultados-auditoria/universo-smoke.json
      - name: Ensaio de 50 temporadas, 10 mil nomes
        run: |
          node scripts/auditar-universo-prompt-mestre.mjs --anos=50 --amostra=10000 --semente=2026 --json > resultados-auditoria/universo-50-anos-10k.json
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync(process.argv[1])); if(a.parametros.nacionalidades!==83||a.parametros.amostraNomes!==10000||a.mundo.temporadasSimuladas!==50||a.mundo.violacoes!==0) process.exit(1);' resultados-auditoria/universo-50-anos-10k.json
      - name: Resumo das métricas observadas
        if: always()
        run: |
          if [ -f resultados-auditoria/universo-50-anos-10k.json ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const linhas=[
                "### Auditoria exploratória: universo de três clubes",
                "",
                "- Temporadas: "+v.mundo.temporadasSimuladas,
                "- Atletas iniciais / finais (inclui aposentados): "+v.mundo.jogadoresIniciais+" / "+v.mundo.jogadoresMundoFinal,
                "- Atletas ativos finais: "+v.mundo.jogadoresAtivosFinal,
                "- Violações de cobertura/ID: "+v.mundo.violacoes,
                "- JSON inicial/final (bytes): "+v.mundo.tamanhoJsonInicialBytes+" / "+v.mundo.tamanhoJsonFinalBytes,
                "- Pico heap (MiB): "+v.mundo.maxHeapMiB,
                "- Duração (ms): "+v.medicao.duracaoMs,
                "- Nomes analisados: "+v.nomes.totalGerados,
                "- Repetição por nacionalidade: "+v.nomes.taxaRepeticaoPercentual+"%",
                "- Combinações compartilhadas entre nacionalidades: "+v.nomes.combinacoesCompartilhadasEntreNacionalidades,
                "",
                "> O ensaio usa apenas três clubes, não avalia economia mundial, contratos avançados, lesões ou scouting."
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,linhas.join("\n")+"\n");
            ' resultados-auditoria/universo-50-anos-10k.json
          fi
      - name: Preservar os relatórios (também quando há falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-universo-50-anos-10k
          path: resultados-auditoria/*.json
          if-no-files-found: warn
          retention-days: 14

  auditar-catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Simular 50 temporadas do catálogo completo
        run: |
          mkdir -p resultados-auditoria
          node --max-old-space-size=4096 scripts/auditar-catalogo-mundial-50-anos.mjs --anos=50 --semente=2026 --json > resultados-auditoria/catalogo-real-50-anos.json
      - name: Resumo do catálogo, inclusive em caso de falha de cobertura
        if: always()
        run: |
          if [ -f resultados-auditoria/catalogo-real-50-anos.json ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const lines=[
                "### Auditoria do catálogo completo — "+r.parametros.anos+" temporadas",
                "",
                "- Clubes: "+r.parametros.clubesCatalogados,
                "- Atletas iniciais: "+r.inicio.atletas,
                "- Atletas finais / ativos: "+r.fim.atletas+" / "+r.fim.ativos,
                "- Violações de IDs ou posições: "+r.indicadores.violacoes,
                "- Save inicial/final (bytes): "+r.inicio.bytes+" / "+r.fim.bytes,
                "- Maior heap Node (MiB): "+r.indicadores.maxHeapMiB,
                "- Duração total (ms): "+r.indicadores.tempoTotalMs,
                "- P95 de virada anual (ms): "+r.indicadores.tempoTemporadaP95Ms,
                "",
                "> Motor do catálogo; calendários detalhados e bancos do navegador ainda não foram testados."
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");
              console.log(lines.join("\n"));
            ' resultados-auditoria/catalogo-real-50-anos.json
          fi
      - name: Preservar JSON completo de 50 anos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-catalogo-real-50-anos
          path: resultados-auditoria/catalogo-real-50-anos.json
          if-no-files-found: warn
          retention-days: 14
