name: Auditar transição Jogador para Treinador no IndexedDB
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/transicao-jogador-tecnico-indexeddb.spec.mjs'
      - '.github/workflows/auditar-transicao-save.yml'
      - 'src/jogador/rapido.js'
      - 'src/treinador/tecnico.js'
      - 'src/simulacao/armazenamentoMundo.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transicao-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save @playwright/test wait-on
      - run: npx playwright install --with-deps chromium
      - run: GITHUB_PAGES=true npm run build
      - name: Carreira real, aposentadoria, treinador, IndexedDB e duas recargas
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 &
          npx wait-on http://127.0.0.1:4173/A-Joia/
          npx playwright test tests/transicao-jogador-tecnico-indexeddb.spec.mjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-transicao-jogador-tecnico-indexeddb
          path: |
            resultados-auditoria/transicao-jogador-tecnico-indexeddb.json
            test-results/
          retention-days: 14
          if-no-files-found: warn
